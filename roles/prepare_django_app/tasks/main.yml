---
- name: 'Install required packages'
  package:
    state: 'present'
    name:
      - 'python3'
      - 'git'
      - 'libapache2-mod-wsgi-py3'
      - 'python3-pip'
      - 'python3-psycopg2'
      - 'python3-virtualenv'
      - 'virtualenv'
      - 'postgresql-contrib'
  when: not redeploy

- name: 'Create database'
  community.postgresql.postgresql_db:
    name: '{{ database_name }}'
  become: true
  become_user: 'postgres'
  when: not redeploy

- name: 'Create role for database_user'
  community.postgresql.postgresql_user:
    name: '{{ database_user }}'
    password: '{{ database_password }}'
  become: true
  become_user: 'postgres'
  when: not redeploy

- name: 'Grant permissions to database'
  community.postgresql.postgresql_query:
    query: '{{ item }}'
    db: '{{ database_name }}'
  loop:
    - 'GRANT ALL ON DATABASE {{ database_name }} TO "{{ database_user }}";'
    - 'GRANT CREATE ON SCHEMA public TO "{{ database_user }}";'
    - 'GRANT ALL ON ALL TABLES IN SCHEMA public TO "{{ database_user }}";'
    - 'GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO "{{ database_user }}";'
  become: true
  become_user: 'postgres'
  notify: 'Restart postgresql'
  when: not redeploy

- name: 'Include role http_vhost'
  include_role:
    name: 'http_vhost'
  vars:
    service_vhost_extra: true
    http_vhost_app_user: '{{ app_user }}'
  when: not redeploy

# ignore_configcheck prevents module from crashing
# ignore_error is used because the task WILL crash if wsgi is already enabled
- name: 'Activate mod_wsgi on apache2'
  community.general.apache2_module:
    name: wsgi
    state: present
    ignore_configcheck: true
  ignore_errors: true
  notify: 'Reload httpd'
  when: not redeploy

- name: 'Clone repository'
  git:
    repo: '{{ repo_uri }}'
    dest: '{{ app_base_path }}'
    clone: true
    update: true
    version: '{{ app_version }}'
    force: true
  become: true
  become_user: '{{ app_user }}'
  register: repo

- name: 'Chown app_user:www-data app directory'
  file:
    path: '{{ app_base_path }}'
    owner: '{{ app_user }}'
    group: 'www-data'
    recurse: true

- name: 'Install required packages for ansible using pip'
  pip:
    name:
      - '{{ psycopg_version }}'
      - '{{ pycryptodomex_version }}'
    virtualenv: '{{ app_virtualenv }}'
    virtualenv_python: python3
  become: true
  become_user: '{{ app_user }}'

- name: Install python dependencies from requirements.txt
  ansible.builtin.pip:
    requirements: '{{ requirements_path }}/requirements.txt'
    virtualenv: '{{ app_virtualenv }}'
    virtualenv_python: python3
  become: true
  become_user: '{{ app_user }}'
  when: 'requirements_path is defined'
